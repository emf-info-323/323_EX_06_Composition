<!DOCTYPE html>

        <title>Exercice 6 - Composition - Solution</title>
        <style>

            button {

            }

                padding: 1em;
                font-family: 'Consolas', 'Courier New', Courier, monospace;
                font-size: 1em;
                font-weight: normal;
                border: 1px solid #ccc;
                min-height: 2em;
                background: #fafafa;
                color: darkgreen;
            }

            code {
                color: darkred;
            }

            .tableNotes {

            .tableNotes td {

        <script src="ex06-data-examens.js"></script>

    <body>
        <h1>Exercice 6 - <code>Composition</code> - Solution</h1>
        <br />
        <hr />
        <h3>Partie 1 : calculer et ajouter la note à chaque évaluation</h3>
        <button id="idActionC1">C1 - Calculer les notes fédérales des examens et les afficher</button>
        <br />
        <br />
        <table id="tableNotes" class="tableNotes" border="1">
            <thead>
                <tr>
                    <th>Nom</th>

                    <th>Note</th>
                </tr>

        <hr />
        <h3>Partie 2 : calculer et ajouter la note à chaque évaluation</h3>

        <br />
        <br />

                    <th>Note</th>
                </tr>
            </thead>

        <hr />

        <br />
        <pre id="output"></pre>
